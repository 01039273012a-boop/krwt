<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b0f17">
  <title>KRWT Wallet</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>

  <style>
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:Arial,sans-serif;
      background:#0b0f17;
      color:#fff
    }
    .wrap{
      max-width:480px;
      margin:auto;
      padding:22px 18px 40px
    }
    .top{
      display:flex;
      align-items:center;
      gap:12px
    }
    .logo{
      width:54px;
      height:54px;
      border-radius:50%;
      background:url('krwt-logo.jpg') center/cover no-repeat;
      border:5px solid #ddd
    }
    h1{
      font-size:23px;
      margin:0
    }
    .sub{
      color:#8fa1b8;
      font-size:13px;
      margin-top:3px
    }
    .card{
      margin-top:24px;
      background:linear-gradient(145deg,#128af5,#0754c7);
      border-radius:26px;
      padding:26px 22px;
      box-shadow:0 18px 50px #0008
    }
    .label{
      font-size:14px;
      opacity:.8
    }
    .bal{
      font-size:38px;
      font-weight:800;
      margin:8px 0
    }
    .fiat{
      opacity:.75
    }
    .actions{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:12px;
      margin-top:18px
    }
    button{
      border:0;
      border-radius:18px;
      padding:15px 8px;
      font-weight:700;
      font-size:14px;
      cursor:pointer
    }
    .actions button{
      background:#171e29;
      color:white
    }
    #ton-connect{
      margin-top:22px;
      width:100%;
      display:flex;
      justify-content:center
    }
    #ton-connect > div{
      width:100%
    }
    .box{
      margin-top:18px;
      background:#121821;
      border:1px solid #202a38;
      border-radius:22px;
      padding:18px
    }
    .box h2{
      font-size:16px;
      margin:0 0 12px
    }
    .address{
      color:#91a2b8;
      font-size:12px;
      word-break:break-all;
      margin-top:8px
    }
    .status{
      color:#72d69b;
      font-size:13px;
      margin-top:8px
    }
    .note{
      font-size:12px;
      color:#748399;
      line-height:1.5;
      margin-top:18px;
      text-align:center
    }
  </style>
</head>

<body>

<div class="wrap">

  <div class="top">
    <div class="logo"></div>
    <div>
      <h1>KRWT Wallet</h1>
      <div class="sub">Korea Won Token</div>
    </div>
  </div>

  <div class="card">
    <div class="label">보유 KRWT</div>
    <div class="bal">0 KRWT</div>
    <div class="fiat">≈ ₩0</div>
  </div>

  <div class="actions">
    <button onclick="alert('KRWT 전송 기능은 Jetton 연결 후 활성화합니다.')">
      ↑<br>보내기
    </button>

    <button onclick="showAddress()">
      ↓<br>받기
    </button>

    <button onclick="alert('거래내역 기능은 다음 단계에서 연결합니다.')">
      ≡<br>내역
    </button>
  </div>

  <div id="ton-connect"></div>

  <div class="box">
    <h2>KRWT</h2>
    <div id="walletStatus">
      TON 지갑을 연결해주세요.
    </div>
    <div id="walletAddress" class="address"></div>
  </div>

  <div class="note">
    개인키·시드 문구·Telegram Bot Token을 이 웹페이지에 입력하지 마세요.
  </div>

</div>

<script>
  const tg = window.Telegram?.WebApp;

  if (tg) {
    tg.ready();
    tg.expand();
  }

  const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
    manifestUrl:
      'https://01039273012a-boop.github.io/krwt/tonconnect-manifest.json',
    buttonRootId: 'ton-connect'
  });

  tonConnectUI.onStatusChange(wallet => {

    const status = document.getElementById('walletStatus');
    const address = document.getElementById('walletAddress');

    if (wallet) {

      status.innerHTML =
        '<span class="status">● TON 지갑 연결됨</span>';

      address.textContent =
        wallet.account.address;

    } else {

      status.textContent =
        'TON 지갑을 연결해주세요.';

      address.textContent = '';

    }
  });

  function showAddress() {

    if (!tonConnectUI.wallet) {

      alert('먼저 TON 지갑을 연결해주세요.');
      return;

    }

    alert(
      '내 TON 주소:\n\n' +
      tonConnectUI.wallet.account.address
    );
  }// ===== KRWT 실제 메인넷 잔액 조회 =====

const KRWT_MASTER =
  "EQDFmBWNDuPifn4GTCLN2pddJpZ-HBl-YaJWxeTZdALwOMz0";

async function loadKRWTBalance() {

  const wallet = tonConnectUI.wallet;

  if (!wallet) {
    return;
  }

  const ownerAddress = wallet.account.address;

  try {

    const url =
      "https://toncenter.com/api/v3/jetton/wallets" +
      "?owner_address=" + encodeURIComponent(ownerAddress) +
      "&jetton_address=" + encodeURIComponent(KRWT_MASTER) +
      "&limit=1";

    const response = await fetch(url);
    const data = await response.json();

    let rawBalance = "0";

    if (data.jetton_wallets && data.jetton_wallets.length > 0) {
      rawBalance = data.jetton_wallets[0].balance || "0";
    }

    // KRWT가 9 decimals 기준인 경우
    const decimals = 9;

    const whole = BigInt(rawBalance);
    const divisor = 10n ** BigInt(decimals);

    const integerPart = whole / divisor;
    const decimalPart = whole % divisor;

    let formatted = integerPart.toLocaleString();

    if (decimalPart !== 0n) {

      let fraction =
        decimalPart.toString().padStart(decimals, "0");

      fraction = fraction.replace(/0+$/, "");

      formatted += "." + fraction;
    }

    // 화면에서 "0 KRWT"가 들어있는 큰 숫자 영역 찾기
    const candidates = document.querySelectorAll("div");

    for (const el of candidates) {

      if (
        el.textContent.trim() === "0 KRWT" ||
        el.textContent.trim().match(/^[\d,.]+\sKRWT$/)
      ) {

        el.textContent = formatted + " KRWT";
        break;

      }
    }

    console.log("KRWT raw balance:", rawBalance);
    console.log("KRWT balance:", formatted);

  } catch (error) {

    console.error("KRWT balance error:", error);

  }
}


// TON 지갑 연결 상태가 변경될 때 실제 KRWT 잔액 조회

tonConnectUI.onStatusChange(wallet => {

  if (wallet) {

    setTimeout(() => {
      loadKRWTBalance();
    }, 1000);

  }

});


// 이미 연결된 지갑이 있으면 페이지 시작 후 조회

setTimeout(() => {

  if (tonConnectUI.wallet) {
    loadKRWTBalance();
  }

}, 1500);
</script>

</body>
</html>
